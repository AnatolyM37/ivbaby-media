name: Посты Instagram и Telegram
on:
  schedule:
    - cron: '40 15 * * 0,1,3,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ivbaby-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYS_PASSWORD: ${{ secrets.KEYS_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q openpyxl pillow
      - name: Ключи
        run: |
          KP="$(printf '%s' "$KEYS_PASSWORD" | tr -d '[:space:]')"
          echo "Длина пароля в секрете KEYS_PASSWORD: ${#KP} (должно быть 43)"
          if [ -z "$KP" ]; then echo "::error::Секрет KEYS_PASSWORD не задан: Settings → Secrets and variables → Actions"; exit 1; fi
          echo "KP=$KP" >> "$GITHUB_ENV"
          echo "::add-mask::$KP"
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in bot/keys.enc -out bot/api-keys.txt -pass env:KP; then
            rm -f bot/api-keys.txt
            echo "::error::Пароль в секрете KEYS_PASSWORD неверный — проверьте, что вставлен целиком"; exit 1
          fi
      - name: Публикация поста
        run: python3 bot/publish.py bot
      - name: Таблица продвижения
        if: always()
        run: python3 bot/stats.py update bot || true
      - name: Сохранить результат
        if: always()
        run: |
          if [ -f bot/api-keys.txt ] && [ -n "$KP" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in bot/keys.enc -out "$RUNNER_TEMP/old.txt" -pass env:KP
            if ! cmp -s bot/api-keys.txt "$RUNNER_TEMP/old.txt"; then
              openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in bot/api-keys.txt -out bot/keys.enc -pass env:KP
            fi
            rm -f bot/api-keys.txt "$RUNNER_TEMP/old.txt"
          fi
          git config user.name "ivbaby-bot"
          git config user.email "ivbaby-bot@users.noreply.github.com"
          git add -A bot
          if ! git diff --cached --quiet; then
            git commit -m "Посты Instagram и Telegram: $(date -u +%F)"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
